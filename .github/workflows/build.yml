name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item (Get-Command node.exe).Source resources\node.exe -Force

      - name: Build portable exe
        run: pnpm run dist

      - name: Build installer (publish on tag)
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            pnpm exec electron-builder --win nsis --publish always
          } else {
            pnpm run dist:installer
          }

      - name: Upload portable exe to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $exe = (Get-ChildItem dist -Filter 'DeepSeek-Harness-*.exe' | Where-Object { $_.Name -notlike '*Setup*' }).FullName
          gh release upload $tag $exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

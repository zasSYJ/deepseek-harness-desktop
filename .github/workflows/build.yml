name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item (Get-Command node.exe).Source resources\node.exe -Force

      - name: Build portable exe
        run: pnpm run dist

      - name: Build installer
        run: pnpm run dist:installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item (Get-Command node.exe).Source resources\node.exe -Force

      - name: Build portable exe
        run: pnpm exec electron-builder --win portable --publish never

      - name: Build installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Create GitHub release with all files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $setup = (Get-ChildItem dist -Filter 'DeepSeek-Harness-Setup-*.exe').FullName
          $portable = (Get-ChildItem dist -Filter 'DeepSeek-Harness-*.exe' | Where-Object { $_.Name -notlike '*Setup*' }).FullName
          $blockmap = (Get-ChildItem dist -Filter '*.blockmap').FullName
          $latest = (Get-ChildItem dist -Filter 'latest.yml').FullName
          gh release create $tag $setup $portable $blockmap $latest `
            --title "DeepSeek Harness 桌面版 $tag" `
            --notes "Windows 桌面版 v$tag`n`n- 安装版（推荐，支持自动更新）：DeepSeek-Harness-Setup-$tag.exe`n- 免安装版：DeepSeek-Harness-Portable-$tag.exe`n`n⭐ 如果觉得好用，欢迎点个 Star 支持一下：https://github.com/zasSYJ/deepseek-harness-desktop`n`n详情见 README。"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

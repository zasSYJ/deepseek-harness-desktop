name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare bundled plugins
        shell: pwsh
        run: |
          & scripts\prepare-bundled-plugins.ps1

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item (Get-Command node.exe).Source resources\node.exe -Force

      - name: Build portable exe
        run: pnpm exec electron-builder --win portable --publish never

      - name: Build installer
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Create GitHub release with all files
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $ver = $tag -replace '^v', ''
          $setup = (Get-ChildItem dist -Filter 'DeepSeek-Harness-Setup-*.exe').FullName
          $portable = (Get-ChildItem dist -Filter 'DeepSeek-Harness-Portable-*.exe').FullName
          $blockmap = (Get-ChildItem dist -Filter '*.blockmap').FullName
          $latest = (Get-ChildItem dist -Filter 'latest.yml').FullName
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $changelog = Get-Content (Join-Path $PWD 'CHANGELOG.md') -Raw -ErrorAction SilentlyContinue
          $match = [regex]::Match($changelog, "(?ms)^##\s*" + [regex]::Escape($tag) + "\s*\r?\n(.+?)(?=^##\s|\z)")
          if ($match.Success) {
            $notesText = $match.Groups[1].Value.Trim()
          } else {
            $notesText = "Windows Desktop $tag`n`nSee README: https://github.com/zasSYJ/deepseek-harness-desktop"
          }
          [System.IO.File]::WriteAllText($notesFile, $notesText, (New-Object System.Text.UTF8Encoding($false)))
          gh release create $tag $setup $portable $blockmap $latest `
            --title "DeepSeek Harness Desktop $tag" `
            --notes-file $notesFile

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
